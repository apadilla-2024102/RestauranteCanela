services:
  # ========== DATABASES ==========
  postgres:
    image: postgres:13
    container_name: restaurante_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-restaurante}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-RestauranteCanela2026!}
      POSTGRES_DB: ${POSTGRES_DB:-restaurante_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-restaurante}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - restaurante-network

  mongodb:
    image: mongo:7.0
    container_name: restaurante_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-RestauranteCanela2026!}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-restaurante}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - restaurante-network

  # ========== AUTH SERVICE (.NET) ==========
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: restaurante_auth_service
    environment:
      ASPNETCORE_ENVIRONMENT: ${ENV:-Production}
      ASPNETCORE_URLS: http://+:5156
      ConnectionStrings__DefaultConnection: "Server=postgres;Port=5432;Database=${POSTGRES_DB:-restaurante_db};User Id=${POSTGRES_USER:-restaurante};Password=${POSTGRES_PASSWORD:-RestauranteCanela2026!};"
      JWT_SECRET: ${JWT_SECRET:-SecretKeyForAuthServiceRestauranteCanela2026!}
    ports:
      - "${AUTH_SERVICE_PORT:-5156}:5156"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5156/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - restaurante-network

  # ========== ORDER SERVICE ==========
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: restaurante_order_service
    environment:
      PORT: 3001
      NODE_ENV: ${ENV:-production}
      URI_MONGODB: "mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-RestauranteCanela2026!}@mongodb:27017/${MONGO_DB:-restaurante}?authSource=admin"
      JWT_SECRET: ${JWT_SECRET:-SecretKeyForAuthServiceRestauranteCanela2026!}
    ports:
      - "${ORDER_SERVICE_PORT:-3001}:3001"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - restaurante-network

  # ========== MENU INVENTORY SERVICE ==========
  menu-inventory-service:
    build:
      context: ./menu-inventory-service
      dockerfile: Dockerfile
    container_name: restaurante_menu_service
    environment:
      PORT: 3002
      NODE_ENV: ${ENV:-production}
      URI_MONGODB: "mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-RestauranteCanela2026!}@mongodb:27017/${MONGO_DB:-restaurante}?authSource=admin"
      JWT_SECRET: ${JWT_SECRET:-SecretKeyForAuthServiceRestauranteCanela2026!}
    ports:
      - "${MENU_SERVICE_PORT:-3002}:3002"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - restaurante-network

  # ========== PAYMENT SERVICE ==========
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: restaurante_payment_service
    environment:
      PORT: 3003
      NODE_ENV: ${ENV:-production}
      URI_MONGODB: "mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-RestauranteCanela2026!}@mongodb:27017/${MONGO_DB:-restaurante}?authSource=admin"
      JWT_SECRET: ${JWT_SECRET:-SecretKeyForAuthServiceRestauranteCanela2026!}
    ports:
      - "${PAYMENT_SERVICE_PORT:-3003}:3003"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - restaurante-network

  # ========== RESERVATION SERVICE ==========
  reservation-service:
    build:
      context: ./reservation-service
      dockerfile: Dockerfile
    container_name: restaurante_reservation_service
    environment:
      PORT: 3004
      NODE_ENV: ${ENV:-production}
      URI_MONGODB: "mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-RestauranteCanela2026!}@mongodb:27017/${MONGO_DB:-restaurante}?authSource=admin"
      JWT_SECRET: ${JWT_SECRET:-SecretKeyForAuthServiceRestauranteCanela2026!}
    ports:
      - "${RESERVATION_SERVICE_PORT:-3004}:3004"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - restaurante-network

  # ========== REPORT SERVICE ==========
  report-service:
    build:
      context: ./report-service
      dockerfile: Dockerfile
    container_name: restaurante_report_service
    environment:
      PORT: 3006
      NODE_ENV: ${ENV:-production}
      URI_MONGODB: "mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-RestauranteCanela2026!}@mongodb:27017/${MONGO_DB:-restaurante}?authSource=admin"
      JWT_SECRET: ${JWT_SECRET:-SecretKeyForAuthServiceRestauranteCanela2026!}
    ports:
      - "${REPORT_SERVICE_PORT:-3006}:3006"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - restaurante-network

  # ========== RESTAURANT SERVICE ==========
  restaurant-service:
    build:
      context: ./restaurant-service
      dockerfile: Dockerfile
    container_name: restaurante_restaurant_service
    environment:
      PORT: 3005
      NODE_ENV: ${ENV:-production}
      URI_MONGODB: "mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-RestauranteCanela2026!}@mongodb:27017/${MONGO_DB:-restaurante}?authSource=admin"
      JWT_SECRET: ${JWT_SECRET:-SecretKeyForAuthServiceRestauranteCanela2026!}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3005}
    ports:
      - "${RESTAURANT_SERVICE_PORT:-3005}:3005"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - restaurante-network

networks:
  restaurante-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
